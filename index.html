<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalian MedSource</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#0E4D45; --pine-2:#0A3A34; --pine-soft:#E3EFEC;
  --ink:#1C2B33; --muted:#5A6B73; --line:#D5DDDF; --surface:#F6F8F7; --card:#FFFFFF;
  --amber:#F2C14E; --amber-ink:#3A2A00; --danger:#B42318; --danger-soft:#FDECEA;
  --ok:#1F7A3E; --low:#B26B00; --alloc:#1F5FAD; --focus:#2D7FF9;
  --header:#FFFFFF; --footer:#17242A; --footer-ink:#D9E2E5;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pine:#3FA393; --pine-2:#2B7E71; --pine-soft:#173A35;
    --ink:#E6EDEF; --muted:#9FB0B6; --line:#33444B; --surface:#121A1D; --card:#1A2427;
    --amber:#8C6A12; --amber-ink:#FFF3D1; --danger:#F07167; --danger-soft:#3A1E1C;
    --ok:#5CCB84; --low:#F0AD4E; --alloc:#79A9F0;
    --header:#1A2427; --footer:#0B1113; --footer-ink:#B8C6CB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --pine:#3FA393; --pine-2:#2B7E71; --pine-soft:#173A35;
  --ink:#E6EDEF; --muted:#9FB0B6; --line:#33444B; --surface:#121A1D; --card:#1A2427;
  --amber:#8C6A12; --amber-ink:#FFF3D1; --danger:#F07167; --danger-soft:#3A1E1C;
  --ok:#5CCB84; --low:#F0AD4E; --alloc:#79A9F0;
  --header:#1A2427; --footer:#0B1113; --footer-ink:#B8C6CB;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--pine)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:4px;border:1px solid var(--pine);background:var(--pine);color:#fff;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pine-2)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--pine-soft)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--pine);text-decoration:underline;cursor:pointer}
.link:disabled{color:var(--muted);cursor:not-allowed;text-decoration:none}
.muted{color:var(--muted)}
.err{color:var(--danger);font-size:13px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--card)}
input.invalid{border-color:var(--danger)}

/* Header */
header.top{background:var(--header);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:24px;height:76px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.brand svg{flex:none}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:20px;font-weight:400;color:var(--pine)}
nav.main{display:flex;gap:4px}
.dd{position:relative}
.dd>button{background:none;border:0;padding:10px 12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:4px}
.dd>button:hover,.dd.open>button{background:var(--pine-soft)}
.dd-menu{position:absolute;top:100%;left:0;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:40;display:none}
.dd.open .dd-menu{display:block}
.dd-menu a,.dd-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:4px;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer}
.dd-menu a:hover,.dd-menu button:hover{background:var(--pine-soft)}
.utils{display:flex;gap:6px}
.util{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px 8px;cursor:pointer;border-radius:4px;color:var(--ink)}
.util:hover{background:var(--pine-soft)}
.badge{position:absolute;top:-2px;right:0;background:var(--alloc);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;line-height:16px;min-width:18px;text-align:center}
.utils .dd-menu{left:auto;right:0}
.dd>button.util{font-weight:400;padding:6px 8px}
td.nw{white-space:nowrap}

/* Sub-navigation row */
.subnav{background:var(--pine-soft);border-bottom:1px solid var(--line)}
.subnav .wrap{display:flex;align-items:center;gap:10px;min-height:48px;flex-wrap:wrap}
.subnav nav.main{margin-left:0}
.acct{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;padding:5px 12px;border-radius:6px;line-height:1.2;display:flex;gap:8px;align-items:center}
.acct:disabled{cursor:default}
.acct:not(:disabled):hover{border-color:var(--pine)}
.acct b{font-size:13.5px}
.acct small{color:var(--muted);font-size:12.5px}
.searchbox{flex:1;max-width:480px;margin-left:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 2px 2px 12px}
.searchbox input{flex:1;border:0;background:transparent;color:var(--ink);outline-offset:4px;min-width:0}
.searchbox button{border:0;background:var(--pine);color:#fff;border-radius:6px;width:36px;height:34px;cursor:pointer;display:grid;place-items:center}
.qa{background:transparent;color:var(--pine);border:1.5px solid var(--pine);border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center}
.qa:hover{background:var(--card)}

.x{background:none;border:0;cursor:pointer;font-size:22px;line-height:1;color:inherit;padding:4px 8px}

main{min-height:60vh;padding:16px 0 48px}
.crumbs{font-size:14px;margin:4px 0 12px}
.crumbs a{color:var(--ink)}
.crumbs span.sep{margin:0 8px;color:var(--muted)}
h1{font-size:34px;font-weight:600;letter-spacing:-.015em;margin:4px 0 16px}
h2{font-size:20px;margin:0 0 8px}
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead .right{margin-left:auto;display:flex;gap:16px;align-items:center}

.warn{border:1px solid var(--amber);background:color-mix(in srgb,var(--amber) 18%,var(--card));border-radius:4px;padding:10px 14px;display:flex;gap:10px;align-items:center;margin-bottom:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:500}
.tab[aria-selected=true]{border-color:var(--pine);font-weight:700}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:500}
.pill[aria-pressed=true]{background:var(--ink);color:var(--card)}

/* Cart card */
.cart{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.cart.default{border-color:var(--pine);box-shadow:0 0 0 1px var(--pine)}
.cart-top{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.cart.default .cart-top{background:var(--pine-soft)}
.cart-top h3{margin:0;font-size:17px}
.cart-tools{display:flex;gap:6px;margin-left:auto;font-size:13px}
.cart-tools button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink);display:flex;gap:5px;align-items:center}
.cart-tools button:hover{border-color:var(--pine)}
.cart-tools button:disabled{color:var(--muted);cursor:not-allowed;opacity:.6}
.cart-fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 24px;padding:14px 20px;margin:0;font-size:14px}
.cart-fields dt{font-size:12px;color:var(--muted);margin:0 0 2px}
.cart-fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
.cart-fields .wide{grid-column:1/-1}
.cart-fields .link{font-size:13px;margin-left:6px}
.cart-foot{display:flex;align-items:center;gap:14px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.cart-foot .reb{color:var(--muted);font-size:13.5px}
.cart-foot .tot{margin-left:auto;font-size:14px;color:var(--muted)}
.cart-foot .tot b{font-size:20px;color:var(--ink);margin-left:6px;font-weight:700}
.toolbar{display:flex;align-items:center;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.toolbar .right{margin-left:auto}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--ink)}
.seg button[aria-selected=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.panel-foot{display:flex;justify-content:flex-end;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
.count{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11.5px;font-weight:700;text-align:center;margin-left:6px}
.dotmark{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:2px;vertical-align:top}
.wizard{display:grid;grid-template-columns:170px 1fr}
.wizard ol{list-style:none;margin:0;padding:18px 16px;background:var(--surface);border-right:1px solid var(--line);font-size:13.5px}
.wizard li{display:flex;gap:8px;align-items:center;padding:8px 0;color:var(--muted)}
.wizard li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:12px;font-weight:700}
.wizard li.on{color:var(--ink);font-weight:700}
.wizard li.on span{background:var(--pine);border-color:var(--pine);color:#fff}
.wizard li.done span{border-color:var(--pine);color:var(--pine)}
.summary-card{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.summary-card dt{color:var(--muted)} .summary-card dd{margin:0}
.radios{display:flex;gap:16px;flex-wrap:wrap}
.radios label{display:flex;gap:5px;align-items:center;cursor:pointer}
.overview{border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:14px}
.overview .tog{background:none;border:0;cursor:pointer;font-weight:600;display:flex;gap:6px;align-items:center}
.bulk{display:flex;gap:12px;border-left:1px solid var(--line);padding-left:14px}
.bulk button{background:none;border:0;cursor:pointer;font-size:13px;color:var(--ink)}
.bulk button:disabled{color:var(--muted);cursor:not-allowed}
.tablewrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;white-space:nowrap;background:var(--surface)}
th button{background:none;border:0;font-weight:600;cursor:pointer;padding:0;display:flex;gap:3px;align-items:center}
td.num,th.num{text-align:right}
.qty{width:64px;text-align:center}
.stock{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%}
.s-in .dot{background:var(--ok)} .s-low .dot{background:var(--low)} .s-out .dot{background:var(--danger)} .s-alloc .dot{background:var(--alloc)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;border:1px solid currentColor;color:var(--danger);vertical-align:middle}
.tag.c2{color:var(--alloc)}
.switch{position:relative;width:40px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:22px;cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:disabled+span{opacity:.5;cursor:not-allowed}
.switch input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.summary-toggle{margin:24px 0 10px}
.summary-toggle button{background:none;border:0;padding:0;cursor:pointer;font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center;color:var(--ink)}
.inline-edit{display:inline-flex;gap:6px;align-items:center}
.inline-edit input{padding:3px 8px;font-size:14px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px}
.stat b{font-size:28px;display:block;color:var(--pine)}
.result{display:grid;grid-template-columns:1fr auto;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.result h3{margin:0 0 4px;font-size:16px}
.result .meta{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.add{display:flex;gap:8px;align-items:flex-start}
.price{font-weight:700;font-size:16px;text-align:right}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:13px;gap:4px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}
.timeline{display:flex;gap:0;margin:12px 0 20px}
.timeline div{flex:1;text-align:center;font-size:13px;position:relative;padding-top:22px;color:var(--muted)}
.timeline div::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--line);transform:translateX(-50%)}
.timeline div::after{content:"";position:absolute;top:11px;left:calc(50% + 8px);right:calc(-50% + 8px);height:2px;background:var(--line)}
.timeline div:last-child::after{display:none}
.timeline div.done{color:var(--ink);font-weight:600}
.timeline div.done::before{background:var(--pine)}
.timeline div.done::after{background:var(--pine)}
.msg{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px}
.msg.unread{font-weight:700}
.msg:hover{background:var(--pine-soft)}

.spinner{display:grid;place-items:center;padding:100px 0}
.spinner i{width:56px;height:56px;border-radius:50%;border:5px solid var(--pine-soft);border-top-color:var(--pine);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner i{animation-duration:2.4s}}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.55);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:60px 16px;overflow:auto}
.scrim.show{display:flex}
.modal{background:var(--card);border-radius:8px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:920px}
.modal.side{margin-left:auto;margin-top:-44px;min-height:calc(100vh - 32px);border-radius:8px 0 0 8px;max-width:520px}
.modal header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:20px;color:var(--pine)}
.modal header .x{margin-left:auto}
.modal .body{padding:18px 20px}
.modal footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.steps{display:flex;gap:0;margin-bottom:18px}
.steps div{flex:1;font-size:13px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.steps div.on{color:var(--ink);font-weight:700;border-color:var(--pine)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 12px;font-size:14px;margin-bottom:14px}
.disclosure{font-size:12.5px;color:var(--muted);background:var(--surface);border-radius:4px;padding:10px 12px;margin:12px 0}
.toastbox{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--ink);color:var(--card);padding:10px 18px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:14px}
.toast.bad{background:var(--danger);color:#fff}
.rating{display:flex;gap:8px}
.rating button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.rating button[aria-pressed=true]{background:var(--pine);color:#fff;border-color:var(--pine)}

/* Login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login .art{background:var(--pine);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login .art h1{font-size:44px;line-height:1.1;max-width:12ch;margin:0}
.login .art p{max-width:42ch;opacity:.9}
.login .art svg.bg{position:absolute;right:-80px;bottom:-80px;opacity:.12}
.login form{align-self:center;justify-self:center;width:min(380px,90%);display:flex;flex-direction:column;gap:14px}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px}
.login .hint{font-size:13px;background:var(--pine-soft);border-radius:4px;padding:10px 12px}

footer.site{background:var(--footer);color:var(--footer-ink);padding:40px 0 28px;font-size:14px}
footer.site .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
footer.site h4{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.25);color:#fff;font-size:15px}
footer.site a,footer.site button{color:var(--footer-ink);text-decoration:none;display:block;margin:0 0 9px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
footer.site a:hover,footer.site button:hover{text-decoration:underline}
footer.site .copy{margin-top:20px;font-size:12px;opacity:.8}

@media (max-width:900px){
  nav.main{display:none}
  .utils{margin-left:auto}
  .cart-fields{grid-template-columns:1fr 1fr}
  .wizard{grid-template-columns:1fr}
  .wizard ol{display:flex;gap:16px;border-right:0;border-bottom:1px solid var(--line)}
  .login{grid-template-columns:1fr}
  .login .art{padding:32px;min-height:220px}
  footer.site .cols{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" data-testid="modal-scrim"><div id="modal"></div></div>
<div class="toastbox" id="toasts" aria-live="polite"></div>

<script>
/* ============================================================
   Katalian MedSource — demo pharmacy ordering portal
   All data is fictional. Stored in this browser only.
   ============================================================ */
const STORE_KEY = 'kms-db-v1', SESSION_KEY = 'kms-session-v1';

const P = [
 // id, name, size, mfr, c2, stock, cost, group, rebate, pack, alloc
 {id:'p1', name:'Amoxicillin 500 mg Capsule', size:'100 EA', mfr:'Northwind Pharma', c2:false, stock:'in', cost:18.42, group:'amox', reb:.12, pack:100},
 {id:'p2', name:'Amoxicillin 500 mg Capsule', size:'100 EA', mfr:'Bluecrest Labs', c2:false, stock:'in', cost:14.96, group:'amox', reb:.10, pack:100},
 {id:'p3', name:'Lisinopril 10 mg Tablet', size:'90 EA', mfr:'Northwind Pharma', c2:false, stock:'in', cost:9.87, group:'lisin', reb:.15, pack:90},
 {id:'p4', name:'Lisinopril 10 mg Tablet', size:'90 EA', mfr:'Harborline Generics', c2:false, stock:'out', cost:7.12, group:'lisin', reb:.10, pack:90},
 {id:'p5', name:'Atorvastatin 20 mg Tablet', size:'90 EA', mfr:'Northwind Pharma', c2:false, stock:'in', cost:22.30, group:'ator', reb:.18, pack:90},

      const pool = P.filter(p=>p.c2===c2 && !p.discontinued);
      const lines = [];

      for(let k=0;k<n;k++){ const p = pool[Math.floor(rnd()*pool.length)]; if(lines.find(l=>l.pid===p.id)) continue; const qty = 1+Math.floor(rnd()*6); lines.push({pid:p.id, qty, shipped:qty, cost:p.cost}); }
      let status = day<4 ? 'Submitted' : day<7 ? 'Processing' : day<10 ? 'Shipped' : statuses[i%statuses.length]==='Submitted' ? 'Delivered' : 'Delivered';
      const o = {id:uid(), number:nextOrder(), date:daysAgo(day), po: i%3===0 ? `PO-${acctPrefix}${1200+i}` : '', memo: i%5===0 ? 'Weekly restock' : '', method: c2 ? 'csos' : 'po', type: c2?'c2':'non', utn: c2 ? 'KM' + String(1000000+i*313).slice(0,7) : '', status, lines};

  const acct = (name, number, dea, o, carts) => ({name, number, dea, carts, orders:o.orders, backorders:o.backorders, messages:messages(), unreadBadge:5, alerts:alerts(), alertsDismissed:false, usedUTN:o.orders.filter(x=>x.utn).map(x=>x.utn), edi:{failures:ediFailures(), dismissed:false}, lists:[{id:uid(), name:'Weekly reorder', items:['p3','p7','p11']},{id:uid(), name:'Flu season', items:['p15','p1']}]});

function bindLogin(){
  const f = () => { $('#lbtn').disabled = !($('#lu').value.trim() && $('#lp').value); };
  $('#lu').addEventListener('input', f); $('#lp').addEventListener('input', f);
}
function doLogin(un, pw){
  const u = DB.users[un.trim().toLowerCase()];
  if(u && u.locked){ UI.loginErr = 'Account locked. Contact support.'; save(); render(); return; }
  if(!u || u.password !== pw){
    if(u){ u.fails++; if(u.fails>=5){ u.locked = true; UI.loginErr = 'Account locked. Contact support.'; save(); render(); return; } }
    UI.loginErr = 'Invalid username or password'; save(); render(); return;
  }
  u.fails = 0; S.user = un.trim().toLowerCase(); S.account = u.accounts[0];
  u.accounts.forEach(id=>DB.accounts[id].alertsDismissed=false);
  UI = freshUI(); save(); location.hash = 'home'; startLoad();
}

function sortedLines(c){
  const s = UI.sort[c.id]; if(!s) return c.lines;
  const key = { qty:l=>l.qty, name:l=>prod(l.pid).name, ndc:l=>prod(l.pid).ndc, cin:l=>prod(l.pid).cin, contract:l=>prod(l.pid).contract, est:l=>prod(l.pid).cost*0.68, inv:l=>prod(l.pid).cost, total:l=>lineTotal(l) }[s.col];
  return [...c.lines].sort((a,b)=>{ const x=key(a), y=key(b); return (x>y?1:x<y?-1:0) * (s.dir==='asc'?1:-1); });
}

const steps = n => `<ol data-testid="step-indicator"><li class="${n===1?'on':'done'}"><span>1</span>Tracking number</li><li class="${n===2?'on':''}"><span>2</span>Review and place</li></ol>`;
const cartById = id => A().carts.find(c=>c.id===id);

function analyze(c){
  const out = [];
  c.lines.forEach(l=>{ const p = prod(l.pid); const best = P.filter(q=>q.group===p.group && q.id!==p.id && q.stock!=='out' && q.cost<p.cost).sort((a,b)=>a.cost-b.cost)[0];
    if(best) out.push({from:p.id, to:best.id, cur:r2(l.qty*p.cost), alt:r2(l.qty*best.cost), save:r2(l.qty*(p.cost-best.cost))}); });
  return out;
}

/* ---------- actions ---------- */
function touch(c){ c.updatedBy = user().handle; c.updatedAt = new Date().toISOString(); }
function addToCart(c, pid, qty){ const ex = c.lines.find(l=>l.pid===pid); if(ex) ex.qty += qty; else c.lines.push({pid, qty, subs:!prod(pid).c2}); touch(c); }
function suggestUTN(){ const used = new Set(A().usedUTN); let n; do { n = 'KM' + String(Math.floor(1000000 + Math.random()*8999999)); } while(used.has(n)); return n; }
function validateUTN(v){ if(!v) return 'Enter a unique tracking number.'; if(!UTN_RE.test(v)) return 'Unique tracking number must be exactly 9 letters or numbers.'; if(A().usedUTN.includes(v.toUpperCase())) return 'This unique tracking number was already used on a previous order. Enter a new one.'; return ''; }

function placeOrder(cartId, extra){
  const a = A(); const c = cartById(cartId);
  const o = {id:uid(), number:c.orderNo, date:new Date().toISOString(), po:c.po, memo:c.memo, method:c.method, type:c.type, utn:extra.utn?extra.utn.toUpperCase():'', form222:extra.form222||'', status:extra.status, lines:c.lines.map(l=>({pid:l.pid, qty:l.qty, shipped:l.qty, cost:prod(l.pid).cost}))};
  a.orders.push(o); if(o.utn) a.usedUTN.push(o.utn);
  if(c.isDefault){ c.lines = []; c.po=''; c.memo=''; c.orderNo = String(DB.seq++); touch(c); } else { a.carts = a.carts.filter(x=>x.id!==c.id); }
  delete UI.selected[c.id];
  save(); openModal({type:'placed', number:o.number, status:o.status, id:o.id}); render();
}

function exportCSV(){
  const pend = UI.boView==='pending'; const list = A().backorders.filter(b => pend ? b.status==='Pending' : b.status!=='Pending');
  const head = pend ? ['Product','NDC','Order number','Qty backordered','Order date','Expected'] : ['Product','NDC','Order number','Qty backordered','Order date','Status','Closed'];
  const rows = list.map(b=>{ const p = prod(b.pid); const base = [`${p.name}, ${p.size}`, p.ndc, b.orderNumber, b.qty, fmtDate(b.orderDate)]; return pend ? [...base, fmtDate(b.expected)] : [...base, b.status, fmtDate(b.closed)]; });
  const csv = [head, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{ const blob = new Blob([csv],{type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backorders-${pend?'pending':'history'}.csv`; document.body.appendChild(a); a.click(); a.remove(); toast(`Exported ${rows.length} rows`); }catch(e){ toast('Export isn’t available in this browser', true); }
}

let confirmFn = null;
function confirmDo(title, msg, fn, ok, danger){ confirmFn = fn; openModal({type:'confirm', title, msg, ok, danger}); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  const menuLink = e.target.closest('.dd-menu a');
  if(menuLink){ UI.openMenu = null; if(menuLink.getAttribute('href')===location.hash){ e.preventDefault(); startLoad(); } return; }
  // close dropdowns on outside click
  if(UI.openMenu && !e.target.closest('.dd')){ UI.openMenu = null; if(!t) { render(); return; } }
  if(e.target.id==='scrim'){ closeModal(); return; }
  if(!t) return;
  const d = t.dataset, act = d.act;
  const c = d.cart ? cartById(d.cart) : null;
  switch(act){
    case 'nav': e.preventDefault(); go(d.r); break;
    case 'menu': UI.openMenu = UI.openMenu===d.key ? null : d.key; render(); break;
    case 'logout': S = {}; UI = freshUI(); save(); location.hash=''; render(); break;
    case 'reset': confirmDo('Reset demo data','This restores every account, cart, order and message to its starting state.', resetDemo, 'Reset'); break;
    case 'switch-acct': if(user().accounts.length>1) openModal({type:'accounts'}); break;
    case 'pick-acct': S.account = d.id; UI = {...freshUI(), searchTerm:UI.searchTerm}; save(); closeModal(); toast(`Switched to ${A().name}`); startLoad(); break;
    case 'quickadd': openModal({type:'quickadd', cart: (A().carts.find(c=>c.type==='non'&&c.isDefault)||{}).id, rows:[{code:'',qty:'1'},{code:'',qty:'1'},{code:'',qty:'1'}]}); break;
    case 'qa-row': if(modalState.rows.length<25){ syncQA(); modalState.rows.push({code:'',qty:'1'}); renderModal(); } break;
    case 'qa-go': { syncQA(); const tc = cartById(modalState.cart); let added = 0;
      modalState.rows.forEach(r=>{ if(!r.code.trim()){ r.result=''; r.ok=null; return; } const p = findByCode(r.code);
        if(!p){ r.result='Item not found'; r.ok=false; return; }
        if(p.c2 !== (tc.type==='c2')){ r.result='Wrong cart type for this item'; r.ok=false; return; }
        if(!validQty(r.qty)){ r.result='Enter a quantity from 1 to 999'; r.ok=false; return; }
        if(p.discontinued){ r.result='Discontinued'; r.ok=false; return; }
        addToCart(tc, p.id, +r.qty); r.result=`Added ${r.qty} x ${p.name}`; r.ok=true; added++; });
      save(); renderModal(); render(); if(added) toast(`Added ${added} items to ${tc.isDefault?'Default cart':tc.name}`); break; }
    case 'add': { const p = prod(d.pid); const v = document.querySelector(`[data-sq="${p.id}"]`).value.trim();
      if(!validQty(v)){ UI.addErr[p.id] = 'Enter a quantity from 1 to 999'; render(); break; }
      const tc = A().carts.find(c=>c.isDefault && c.type===(p.c2?'c2':'non'));
      const inCart = (tc.lines.find(l=>l.pid===p.id)||{qty:0}).qty;
      if(p.alloc && inCart + +v > allocRemaining(p)){ UI.addErr[p.id] = `Quantity exceeds remaining allocation of ${allocRemaining(p)}`; render(); break; }
      delete UI.addErr[p.id]; addToCart(tc, p.id, +v); save(); render(); toast(`Added ${v} x ${p.name} to ${tc.isDefault?'Default cart '+tc.orderNo:tc.name}`); break; }
    case 'alloc': openModal({type:'alloc', pid:d.pid}); break;
    case 'subs': openModal({type:'subs', pid:d.pid, cart:d.cart}); break;
    case 'swap': { const cc = cartById(d.cart); const l = cc.lines.find(x=>x.pid===d.from); const ex = cc.lines.find(x=>x.pid===d.to);
      if(ex){ ex.qty += l.qty; cc.lines = cc.lines.filter(x=>x!==l); } else { l.pid = d.to; } touch(cc); save(); closeModal(); render(); toast('Product swapped'); break; }
    case 'prodlink': e.preventDefault(); UI.searchTerm = prod(d.pid).ndc; go('search'); break;
    case 'tab': UI.tab = d.t; UI.editing = null; render(); break;
    case 'summary': UI.summaryOpen = !UI.summaryOpen; render(); break;
    case 'toggle-cart': UI.expanded[d.cart] = !UI.expanded[d.cart]; render(); break;
    case 'new-cart': { const a = A(); let i = 1; while(a.carts.some(x=>x.name===`New cart ${i}`)) i++;
      const nc = {id:uid(), name:`New cart ${i}`, orderNo:String(DB.seq++), type:UI.tab, isDefault:false, po:'', memo:'', updatedBy:user().handle, updatedAt:new Date().toISOString(), method:UI.tab==='c2'?'csos':'po', lines:[]};
      a.carts.push(nc); UI.openMenu = null; UI.summaryOpen = true; UI.expanded[nc.id] = true; save(); render(); toast(`Created ${nc.name}`); break; }
    case 'edit': { const val = d.field==='name' ? c.name : c[d.field]; UI.editing = {cart:c.id, field:d.field, value:val, err:''}; render(); const inp = document.querySelector('[data-edit]'); inp && inp.focus(); break; }
    case 'cancel-edit': UI.editing = null; render(); break;
    case 'save-edit': saveEdit(); break;
    case 'del-cart': if(c.isDefault) break; confirmDo('Delete cart', `Delete cart ${c.name}? This cannot be undone.`, ()=>{ A().carts = A().carts.filter(x=>x.id!==c.id); save(); render(); toast(`Deleted ${c.name}`); }, 'Delete', true); break;
    case 'sort': { const s = UI.sort[d.cart]; UI.sort[d.cart] = {col:d.col, dir: s && s.col===d.col && s.dir==='asc' ? 'desc' : 'asc'}; render(); break; }
    case 'bulk-move': openModal({type:'move', cart:c.id}); break;
    case 'move-to': { const from = cartById(d.from), to = cartById(d.to); const sel = UI.selected[from.id];
      from.lines.filter(l=>sel.includes(l.pid)).forEach(l=>addToCart(to, l.pid, l.qty)); from.lines = from.lines.filter(l=>!sel.includes(l.pid)); UI.selected[from.id] = []; touch(from); save(); closeModal(); render(); toast(`Moved ${sel.length} lines to ${to.isDefault?'Default cart':to.name}`); break; }
    case 'bulk-del': { const sel = UI.selected[c.id]; confirmDo('Delete lines', `Delete ${sel.length} selected lines from this cart?`, ()=>{ c.lines = c.lines.filter(l=>!sel.includes(l.pid)); UI.selected[c.id] = []; touch(c); save(); render(); toast(`Deleted ${sel.length} lines`); }, 'Delete', true); break; }
    case 'bulk-list': openModal({type:'addlist', cart:c.id}); break;
    case 'list-save': { const pick = document.querySelector('[data-list-pick]').value; const nn = document.querySelector('[data-list-new]').value.trim(); const a = A(); let L;
      if(pick==='__new'){ if(!nn){ toast('Enter a name for the new list', true); break; } L = {id:uid(), name:nn, items:[]}; a.lists.push(L); } else L = a.lists.find(x=>x.id===pick);
      UI.selected[d.cart].forEach(pid=>{ if(!L.items.includes(pid)) L.items.push(pid); }); save(); closeModal(); toast(`Saved ${UI.selected[d.cart].length} products to ${L.name}`); break; }
    case 'analyze': openModal({type:'analyze', cart:c.id}); break;
    case 'apply-sugg': { const l = c.lines.find(x=>x.pid===d.from); const ex = c.lines.find(x=>x.pid===d.to); if(ex){ ex.qty += l.qty; c.lines = c.lines.filter(x=>x!==l); } else l.pid = d.to; touch(c); save(); renderModal(); render(); toast('Suggestion applied'); break; }
    case 'submit': { if(!c.lines.length) break;
      if(c.type==='c2' && c.method==='csos') openModal({type:'utn', cart:c.id, utn:suggestUTN(), err:''});
      else if(c.type==='c2' && c.method==='paper') openModal({type:'form222', cart:c.id});
      else openModal({type:'review', cart:c.id}); break; }
    case 'utn-continue': { const v = document.querySelector('[data-utn]').value.trim(); const err = validateUTN(v); if(err){ modalState.utn = v; modalState.err = err; renderModal(); break; } modalState = {type:'review', cart:modalState.cart, step:2, utn:v.toUpperCase()}; renderModal(); break; }
    case 'csos-back': modalState = {type:'utn', cart:modalState.cart, utn:modalState.utn, err:''}; renderModal(); break;
    case 'f222-continue': { const v = document.querySelector('[data-f222]').value.trim(); if(!/^\d{9}$/.test(v)){ modalState.val = v; modalState.err = 'Enter the 9-digit serial number from your DEA Form 222.'; renderModal(); break; } modalState = {type:'review', cart:modalState.cart, form222:v}; renderModal(); break; }
    case 'place': { const s = modalState; const cc = cartById(s.cart); const status = cc.type==='c2' && cc.method==='csos' ? 'Awaiting signature' : cc.type==='c2' && cc.method==='paper' ? 'Awaiting DEA form' : 'Submitted'; placeOrder(s.cart, {utn:s.utn, form222:s.form222, status}); break; }
    case 'view-placed': UI.orderId = d.id; closeModal(); go('order-details'); break;
    case 'open-order': e.preventDefault(); UI.orderId = d.id; go('order-details'); break;
    case 'page': UI.orderPage = +d.p; render(); break;
    case 'reorder': { const o = A().orders.find(x=>x.id===d.id); const skipped = []; let n = 0;
      o.lines.forEach(l=>{ const p = prod(l.pid); if(p.discontinued){ skipped.push(p.name); return; } addToCart(A().carts.find(c=>c.isDefault && c.type===(p.c2?'c2':'non')), p.id, l.qty); n++; });
      save(); render(); toast(`Added ${n} lines to your default cart${skipped.length?`. Skipped discontinued: ${skipped.join(', ')}`:''}`); break; }
    case 'bo': UI.boView = d.v; render(); break;
    case 'cancel-bo': confirmDo('Cancel backorder','Cancel this backorder? The remaining quantity will not ship.', ()=>{ const b = A().backorders.find(x=>x.id===d.id); b.status='Cancelled'; b.closed=new Date().toISOString(); save(); render(); toast('Backorder cancelled'); }, 'Cancel backorder', true); break;
    case 'export': exportCSV(); break;
    case 'sign': { const o = A().orders.find(x=>x.id===d.id); o.status = 'Submitted'; save(); render(); toast(`Order ${o.number} signed and submitted`); break; }
    case 'open-msg': { const m = A().messages.find(x=>x.id===d.id); UI.msgOpen = UI.msgOpen===m.id ? null : m.id;
      // Planted defect KM-44: opening a message marks it read but does not decrement the badge
      m.read = true; save(); render(); break; }
    case 'markall': A().messages.forEach(m=>m.read=true); A().unreadBadge = 0; save(); render(); break;
    case 'dismiss-edi': A().edi.dismissed = true; save(); render(); break;
    case 'feedback': openModal({type:'feedback', rating:0}); break;
    case 'rate': modalState.rating = +d.n; modalState.comment = (document.querySelector('[data-fb]')||{}).value; renderModal(); break;
    case 'fb-submit': closeModal(); toast('Thanks for your feedback'); break;
    case 'confirm-ok': { const f = confirmFn; confirmFn = null; closeModal(); f && f(); break; }
    case 'close': closeModal(); break;
    case 'retry': startLoad(); break;
    case 'simfail': S.failNext = true; save(); UI.openMenu = null; render(); toast('The next page you open will fail to load'); break;
  }
});

function syncQA(){ document.querySelectorAll('[data-qa-code]').forEach(i=>modalState.rows[+i.dataset.qaCode].code = i.value); document.querySelectorAll('[data-qa-qty]').forEach(i=>modalState.rows[+i.dataset.qaQty].qty = i.value); const s = document.querySelector('[data-qa-cart]'); if(s) modalState.cart = s.value; }

function saveEdit(){
  const ed = UI.editing; const c = cartById(ed.cart); const v = document.querySelector('[data-edit]').value.trim(); ed.value = v;
  if(ed.field==='name'){
    if(!v) ed.err = 'Cart name is required.';
    else if(v.length>30) ed.err = 'Cart name can be up to 30 characters.';
    else if(A().carts.some(x=>x.id!==c.id && x.name.toLowerCase()===v.toLowerCase())) ed.err = 'You already have a cart with this name.';
    else { c.name = v; ed.err = ''; }
  } else if(ed.field==='po'){
    if(v.length>PO_MAX || !/^[A-Za-z0-9-]*$/.test(v)) ed.err = 'PO number can use up to 20 letters, numbers and hyphens.';
    else { c.po = v; ed.err=''; }
  } else {
    if(v.length>100) ed.err = 'PO memo can be up to 100 characters.'; else { c.memo = v; ed.err=''; }
  }
  if(!ed.err){ touch(c); UI.editing = null; save(); }
  render();
}

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if(d.qty){ const c = cartById(d.qty); const l = c.lines.find(x=>x.pid===d.pid); const k = c.id+'|'+d.pid; const v = t.value.trim();
    if(v==='0'){ t.value = l.qty; confirmDo('Remove line','Remove this line?', ()=>{ c.lines = c.lines.filter(x=>x!==l); touch(c); save(); render(); }, 'Remove', true); return; }
    if(!validQty(v, CART_QTY_MAX)){ UI.qtyErr[k] = {v, m:'Enter a quantity from 1 to 999'}; render(); return; }
    delete UI.qtyErr[k]; l.qty = +v; touch(c); save(); render(); return; }
  if(d.sel){ const arr = UI.selected[d.sel] = UI.selected[d.sel] || []; if(t.checked) arr.push(d.pid); else UI.selected[d.sel] = arr.filter(x=>x!==d.pid); render(); return; }
  if(d.selall){ const c = cartById(d.selall); UI.selected[c.id] = t.checked ? c.lines.map(l=>l.pid) : []; render(); return; }
  if(d.subs){ const c = cartById(d.subs); c.lines.find(x=>x.pid===d.pid).subs = t.checked; touch(c); save(); render(); return; }
  if(d.method){ const c = cartById(d.method); c.method = t.value; touch(c); save(); render(); return; }
  if(d.of){ UI.orderFilter[d.of] = t.value; if(d.of!=='q'){ UI.orderPage = 1; render(); } return; }
  if(t.matches('[data-qa-cart]')){ modalState.cart = t.value; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('[data-utn]') && modalState){ modalState.utn = t.value; const err = t.value.trim() ? validateUTN(t.value.trim()) : 'Enter a unique tracking number.'; const btn = document.querySelector('[data-testid=utn-continue]'); btn.disabled = !!err; }
  if(t.matches('[data-of="q"]')) UI.orderFilter.q = t.value;
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if(!f) return; e.preventDefault();
  if(f==='login'){ doLogin($('#lu').value, $('#lp').value); }
  if(f==='search'){ UI.searchTerm = e.target.querySelector('input').value; UI.addErr = {}; go('search'); }
  if(f==='orderfilter'){ UI.orderPage = 1; render(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ if(modalState) closeModal(); else if(UI.openMenu){ UI.openMenu = null; render(); } }
  if(e.key==='Enter'){
    if(e.target.matches('[data-edit]')){ e.preventDefault(); saveEdit(); }
    if(e.target.matches('.msg')) e.target.click();
    if(e.target.matches('[data-sq]')){ e.preventDefault(); document.querySelector(`[data-act=add][data-pid="${e.target.dataset.sq}"]`).click(); }
  }
});

render();
</script>
</body>
